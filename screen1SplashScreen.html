<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    /* Breathing AI Voice Orb Keyframes */
    @keyframes pulse-halo {
      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.14);
        opacity: 0.65;
      }
    }

    @keyframes pulse-core {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 45px rgba(91, 80, 229, 0.35);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 70px rgba(91, 80, 229, 0.55);
      }
    }

    @keyframes soundwave-1 {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    @keyframes soundwave-2 {
      0%, 100% { height: 18px; }
      50% { height: 8px; }
    }
    @keyframes soundwave-3 {
      0%, 100% { height: 10px; }
      50% { height: 26px; }
    }

    .animate-halo-outer {
      animation: pulse-halo 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .animate-halo-mid {
      animation: pulse-halo 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.7s;
    }
    .animate-core {
      animation: pulse-core 3.6s ease-in-out infinite;
    }

    .wave-bar-1 { animation: soundwave-1 1.2s ease-in-out infinite; }
    .wave-bar-2 { animation: soundwave-2 1.2s ease-in-out infinite 0.2s; }
    .wave-bar-3 { animation: soundwave-3 1.2s ease-in-out infinite 0.4s; }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-high text-on-surface antialiased font-body-md flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">
<!-- Mobile Viewport Shell (390px native container) -->
<main class="w-full max-w-[390px] h-[884px] max-h-[844px] bg-background relative flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[40px] border border-outline-variant/40">
<!-- Top System / Status Clearance (Safe Area Inset) -->
<header class="w-full pt-4 px-6 flex justify-between items-center z-20">
<!-- Minimalist Acoustic System Status -->
<div class="flex items-center gap-1.5 opacity-80">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary animate-ping"></span>
<span class="font-label-sm text-label-sm tracking-widest uppercase text-tertiary">System Ready</span>
</div>
<!-- Studio Mode Pill Badge -->
<div class="px-2.5 py-1 rounded-full bg-surface-container border border-outline-variant/40 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[13px] text-primary" data-icon="graphic_eq">graphic_eq</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">v2.4 Pro</span>
</div>
</header>
<!-- Center Stage: Hypnotic AI Voice Orb & Branding Identity -->
<div class="flex-1 flex flex-col items-center justify-center px-6 relative z-10 -mt-2">
<!-- Voice Atmosphere Glow Backplane -->
<div class="relative flex items-center justify-center w-64 h-64 mb-8">
<!-- Concentric Layer 3 (Outer ambient whisper) -->
<div class="absolute w-56 h-56 rounded-full bg-secondary-fixed/40 filter blur-xl animate-halo-outer"></div>
<!-- Concentric Layer 2 (Middle resonance cyan-violet transition) -->
<div class="absolute w-44 h-44 rounded-full border border-primary-fixed bg-gradient-to-tr from-primary-fixed/30 via-surface-tint/15 to-primary/20 animate-halo-mid"></div>
<!-- Concentric Layer 1 (Inner ring) -->
<div class="absolute w-36 h-36 rounded-full border border-primary/25 bg-secondary-container/10 backdrop-blur-[2px]"></div>
<!-- The AI Breathing Core Orb (120px) -->
<div class="relative w-28 h-28 rounded-full bg-gradient-to-br from-primary-container via-secondary to-primary flex items-center justify-center animate-core cursor-pointer active:scale-95 transition-transform duration-200">
<!-- Internal light inflection -->
<div class="absolute inset-1 rounded-full bg-gradient-to-t from-transparent via-white/10 to-white/30 pointer-events-none"></div>
<!-- Reactive Center Icon Anchor -->
<span class="material-symbols-outlined text-white text-[34px] drop-shadow-sm" data-icon="graphic_eq">graphic_eq</span>
</div>
</div>
<!-- Identity Typography Section -->
<div class="text-center max-w-[320px] flex flex-col items-center space-y-2.5">
<!-- Brand Title -->
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface font-bold tracking-tight">
          Verbalis
        </h1>
<!-- Subtitle: Executive / Technical Focus -->
<p class="font-body-md text-body-md text-on-surface-variant leading-snug font-normal text-balance">
          Personal AI Voice Coach for Technical &amp; Interview Fluency
        </p>
<!-- Subtle Semantic Pill -->
<div class="pt-2">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low border border-outline-variant/30 text-tertiary font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
            Acoustic &amp; Articulation Engine
          </span>
</div>
</div>
</div>
<!-- Bottom Functional Deck (Native Thumb Zone Clearance) -->
<footer class="w-full px-6 pb-8 pt-2 flex flex-col items-center space-y-6 z-20">
<!-- Acoustic 3-Bar Soundwave Loading Indicator -->
<div class="flex flex-col items-center gap-2">
<div class="flex items-center gap-1.5 h-7">
<span class="w-1 rounded-full bg-primary wave-bar-1"></span>
<span class="w-1 rounded-full bg-primary-container wave-bar-2"></span>
<span class="w-1 rounded-full bg-secondary wave-bar-3"></span>
</div>
<p class="font-label-sm text-label-sm text-tertiary tracking-wide uppercase">Calibrating Audio Engine</p>
</div>
<!-- Master Onboarding Action Button -->
<div class="w-full space-y-3">
<button class="w-full h-[52px] bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-2 shadow-sm hover:opacity-95 active:scale-[0.98] transition-all duration-150 group" type="button">
<span>Get Started</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-0.5 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Sub-text Grounding Statement -->
<p class="text-center font-body-sm text-body-sm text-tertiary px-2 leading-relaxed">
          Master spoken English by explaining concepts <span class="text-outline">•</span> Powered by AI
        </p>
</div>
<!-- Home Safe Area Bar Indicator -->
<div class="w-32 h-1 bg-outline-variant/50 rounded-full mt-1"></div>
</footer>
<!-- Background Subtle Atmospheric Texture Rings -->
<div class="absolute -top-32 -right-32 w-80 h-80 rounded-full bg-primary-fixed/20 filter blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-secondary-fixed/25 filter blur-3xl pointer-events-none"></div>
</main>
<script>
    // Lightweight Micro-interaction: Orb responsiveness on touch/click
    document.addEventListener('DOMContentLoaded', () => {
      const orb = document.querySelector('.animate-core');
      if (orb) {
        orb.addEventListener('click', () => {
          orb.classList.remove('animate-core');
          orb.style.transform = 'scale(1.12)';
          setTimeout(() => {
            orb.style.transform = 'scale(1)';
            orb.classList.add('animate-core');
          }, 350);
        });
      }
    });
  </script>
</body></html>
